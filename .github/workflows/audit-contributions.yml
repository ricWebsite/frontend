name: Audit External Contributions

# Contributions from external private repositories outside this organisation
# are explicitly permitted. This workflow records their details for audit
# purposes only — no action is taken to block or flag them.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  audit-pr:
    name: Audit Pull Request Source
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'pull_request'
    steps:
      - name: Log pull request details
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Base repository  : $BASE_REPO"
          echo "Head repository  : ${HEAD_REPO:-<unavailable — fork may have been deleted>}"
          echo "PR author        : $PR_AUTHOR"
          echo "PR number        : #$PR_NUMBER"
          echo "PR title         : $PR_TITLE"
          echo "Head SHA         : $HEAD_SHA"
          echo ""
          if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "ℹ️  External contribution recorded."
            echo "This PR originates from outside $BASE_REPO."
            echo "External private-repository contributions are allowed."
          else
            echo "ℹ️  Internal contribution recorded."
            echo "This PR originates from within $BASE_REPO."
          fi

  audit-direct-push:
    name: Audit Direct Push to Main
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'push'
    steps:
      - name: Log push details
        env:
          PUSHER: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          echo "Repository       : $REPO"
          echo "Ref              : $REF"
          echo "Pushed by        : $PUSHER"
          echo "Commit SHA       : $COMMIT_SHA"
          echo "Commit message   : $COMMIT_MESSAGE"
          echo "Commit author    : $COMMIT_AUTHOR_NAME <$COMMIT_AUTHOR_EMAIL>"
          echo ""
          echo "ℹ️  Direct push to main recorded."
